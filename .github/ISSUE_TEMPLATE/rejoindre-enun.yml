name: Demande d'adhésion
description: Rejoindre l'organisation ENUN et son écosystème de modules.
title: "[ADHÉSION] "
labels: ["adhesion"]
body:
  - type: markdown
    attributes:
      value: |
        Ce formulaire vous inscrit automatiquement dans l'organisation.
        Aucune validation n'est requise.

  - type: input
    id: github_username
    attributes:
      label: Identifiant GitHub
      description: "Tel qu'il apparaît dans votre profil, sans le caractère @."
      placeholder: votre-identifiant
    validations:
      required: true

  - type: input
    id: email_github
    attributes:
      label: Adresse e-mail de votre compte GitHub
      description: "Celle que vous avez configurée dans les paramètres de votre compte."
      placeholder: vous@exemple.com
    validations:
      required: true

  - type: dropdown
    id: role_demande
    attributes:
      label: Niveau d'accès souhaité
      description: |
        - `membre` — lecture des dépôts, ouverture d'issues et de pull requests
        - `moderateur` — en plus : écriture dans les dépôts, développement et relecture
      options:
        - membre
        - moderateur
    validations:
      required: true
