name: Auto-join

# Mecanique reprise du modele d'invitation : seule la personne qui a ouvert
# l'issue est invitee (context.issue.user). Aucun champ libre n'est interprete,
# donc personne ne peut faire inscrire un tiers a sa place.
#
# Contrary to a direct membership call, an invitation must be ACCEPTED by the
# recipient. That is the desired behaviour: it proves the person controls the
# account, and it leaves no unsolicited member in the organization.

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write

jobs:
  invite:
    runs-on: ubuntu-latest
    if: |
      contains(github.event.issue.labels.*.name, 'adhesion') ||
      startsWith(github.event.issue.title, '[ADHÉSION]')
    steps:
      - name: Verifier le secret
        run: |
          if [ -z "${{ secrets.ORG_ADMIN_TOKEN }}" ]; then
            echo "::error::ORG_ADMIN_TOKEN absent. Le workflow ne peut pas inviter."
            exit 1
          fi

      - name: Envoyer l'invitation
        uses: actions/github-script@v7
        env:
          ORG_ADMIN_TOKEN: ${{ secrets.ORG_ADMIN_TOKEN }}
          AUTO_PROMOTE: ${{ vars.AUTO_PROMOTE }}
        with:
          script: |
            const org = 'ENUN-ORG';
            const login = context.issue.user.login;
            const autoPromote = (process.env.AUTO_PROMOTE || 'false').toLowerCase() === 'true';

            const authHeaders = { authorization: 'token ' + process.env.ORG_ADMIN_TOKEN };

            // Le niveau moderateur n'est jamais accorde par l'auto-join sauf
            // AUTO_PROMOTE=true. L'oeil dans la demande est traite a titre
            // indicatif : la decision reste humaine.
            const body = context.payload.issue.body || '';
            const wantsModerator = /moderateur\s*:\s*oui/i.test(body);

            const say = (m) => core.info(m);
            const fail = async (m) => {
              core.setFailed(m);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: m,
              });
            };

            try {
              say('Invitation de @' + login + ' vers ' + org + '...');
              await github.request('PUT /orgs/{org}/invitations', {
                org,
                invitee_id: context.issue.user.id,
                role: 'direct_member',
                headers: authHeaders,
              });
            } catch (error) {
              if (error.status === 422) {
                return fail('Le compte @' + login + ' est deja membre, ou a deja une invitation en attente.');
              }
              if (error.status === 404) {
                return fail('Organisation introuvable, ou token sans permission `admin:org`. Verifiez ORG_ADMIN_TOKEN.');
              }
              if (error.status === 401) {
                return fail('ORG est invalide ou revoque. Regenerez le secret.');
              }
              return fail('Invitation refusee (' + error.status + ') : ' + error.message);
            }

            const lines = [
              '### :white_check_mark: Invitation envoyee, @' + login,
              '',
              'Une invitation a ete envoyee au compte **@' + login + '**.',
              '',
              'Pour finaliser votre adhesion :',
              '',
              '1. Ouvrez https://github.com/orgs/' + org + '/invitation',
              '2. Cliquez sur **Accept invitation**.',
              '',
            ];

            if (wantsModerator && !autoPromote) {
              lines.push(
                '',
                '> Vous avez demande l\'acces `moderateur`. Il n\'est pas accorde automatiquement.',
                '> Une personne ayant le role d\'administration examinera votre demande.',
              );
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: lines.join('\n'),
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: 'closed',
            });

            core.summary.addHeading('Invitation envoyee', 3).write();
